<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Planner | 수행평가 시간표</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><p class="eyebrow">CLASS PLANNER</p><h1>우리 반 수행평가 시간표</h1><p>수행평가 일정을 한눈에 확인하고 관리해 봐!</p></div><span class="tag">Weekly Planner</span></header><section class="panel"><div class="bar"><button id="prev" aria-label="이전 주">‹</button><h2 id="range"></h2><button id="next" aria-label="다음 주">›</button><button id="today" class="secondary">이번 주</button></div><div id="calendar" class="calendar"></div></section><section class="panel"><h2 id="form-title">수행평가 추가</h2><form id="event-form"><label>과목<input id="subject" maxlength="30" placeholder="예: 영어" required></label><label>수행평가명<input id="task" maxlength="80" placeholder="예: 발표" required></label><label>날짜<input id="date" type="date" required></label><div class="actions"><button type="submit" id="save">일정 저장</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button></div></form></section><p class="note">※ 일정은 현재 기기의 브라우저에만 저장돼. 다른 친구와 자동 공유되지는 않아.</p></main><script src="script.js"></script></body></html>
