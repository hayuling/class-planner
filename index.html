<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Planner | 수행평가 시간표</title><link rel="stylesheet" href="style.css?v=mint-design-1"></head><body><main class="wrap"><header><div class="hero-copy"><p class="eyebrow">CLASS PLANNER</p><h1>우리 반 수행평가 시간표</h1><p>수행평가 일정 조회 및 관리</p></div><img class="hero-character" src="assets/mascot.png" alt="" width="1227" height="1267" fetchpriority="high"><button id="planner-toggle" class="tag" type="button" aria-label="월간 보기로 전환" title="클릭해서 주간/월간 보기 전환">Weekly Planner</button></header><section class="panel"><div class="class-picker"><label for="class-select">학급 선택</label><select id="class-select" aria-describedby="class-message"><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option><option value="6">6반</option></select><p id="class-message" role="status"></p></div><div class="bar"><button id="prev" aria-label="이전 주">‹</button><h2 id="range"></h2><button id="next" aria-label="다음 주">›</button><button id="today" class="secondary">이번 주</button></div><p class="mobile-calendar-hint">달력 좌우 스크롤</p><div id="calendar" class="calendar"></div></section><section class="panel" id="login-panel"><h2>관리자 로그인</h2><form id="admin-login"><label>아이디 또는 이메일<input id="admin-identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>비밀번호<input id="admin-password" type="password" autocomplete="current-password" required></label><button type="submit">관리자로 로그인</button></form><p id="auth-message" role="status" aria-live="polite"></p></section><section class="panel" id="admin-controls" hidden><button type="button" id="logout" class="secondary">관리자 로그아웃</button><h2 id="form-title">수행평가 추가</h2><form id="event-form"><label>등록 학급<select id="event-class" required><option value="" disabled>학급 선택</option><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option><option value="6">6반</option></select></label><label>과목<input id="subject" maxlength="30" placeholder="예: 영어" required></label><label>수행평가명<input id="task" maxlength="80" placeholder="예: 발표" required></label><label>날짜<input id="date" type="date" required></label><div class="actions"><button type="submit" id="save">일정 저장</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button></div></form></section><p class="note">※ 모든 방문자에게 일정 공개 · 개인정보 입력 금지 <span id="sync-status">연결 중…</span></p></main><script type="module" src="script.js?v=mint-design-1"></script></body></html>
