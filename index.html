<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Planner | 수행평가 시간표</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><p class="eyebrow">CLASS PLANNER</p><h1>수행평가 시간표</h1><p>수행평가 </p></div><span class="tag">Weekly Planner</span></header><section class="panel"><div class="bar"><button id="prev" aria-label="이전 주">‹</button><h2 id="range"></h2><button id="next" aria-label="다음 주">›</button><button id="today" class="secondary">이번 주</button></div><div id="calendar" class="calendar"></div></section><section class="panel" id="login-panel"><h2>관리자 로그인</h2><form id="admin-login"><label>이메일<input id="admin-email" type="email" autocomplete="username" required></label><label>비밀번호<input id="admin-password" type="password" autocomplete="current-password" required></label><button type="submit">관리자로 로그인</button></form><p id="auth-message"></p></section><section class="panel" id="admin-controls" hidden><button type="button" id="logout" class="secondary">관리자 로그아웃</button><h2 id="form-title">수행평가 추가</h2><form id="event-form"><label>과목<input id="subject" maxlength="30" placeholder="예: 영어" required></label><label>수행평가명<input id="task" maxlength="80" placeholder="예: 발표" required></label><label>날짜<input id="date" type="date" required></label><div class="actions"><button type="submit" id="save">일정 저장</button><button type="button" id="cancel" class="secondary" hidden>수정 취소</button></div></form></section><p class="note">※ 공용 일정은 모든 방문자에게 공유. 개인정보를 입력하지 말 것. <span id="sync-status">연결 중…</span></p></main><script type="module" src="script.js"></script></body></html>
